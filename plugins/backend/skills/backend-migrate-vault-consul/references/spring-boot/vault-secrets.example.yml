# VÍ DỤ định dạng file secret Vault — nạp vào KV v2 path secret/<app>.
# Khi sinh thật sẽ CHỨA SECRET THẬT -> đặt trong configs/vault/ (đã gitignore), KHÔNG commit, xoá sau khi seed.
# Map phẳng theo property-key Spring; seed bằng seed-vault.sh (yq -o=props).
spring.datasource.username: "app_user"
spring.datasource.password: "REPLACE_WITH_REAL"
app.jwt.secret: "REPLACE_WITH_REAL"
app.external.api-key: "REPLACE_WITH_REAL"
